[project]
name = "quran-scholar"
version = "0.1.0"
description = "Quran Scholar: multi-agent Quranic research and tafsir system"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=6.29.5",
    "langchain[openai]>=1.2.10",
    "langchain-community>=0.4.1",
    "langchain-openai>=1.1.10",
    "langchain-text-splitters>=1.1.1",
    "langgraph>=1.0.9",
    "pydantic>=2.13.5",
    "python-dotenv>=1.0.0",
    "httpx>=0.27",
    "tavily-python>=0.7.21",
    "exa-py>=2.4.0",
    "bs4>=0.0.2",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
quran-scholar-web = "quran_scholar.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quran_scholar"]

[tool.uv]
package = true
